<!doctype html>
<meta charset="utf-8" />
<title>pending</title>
<pre id="out">pending</pre>
<script type="module">
  // Dev check: WebRTC connects from the compact (sound-sized) answer alone.
  import { SenderLink, ReceiverLink, decodeAnswer } from "/src/net/rtc.ts";
  const out = document.getElementById("out");
  try {
    const s = new SenderLink();
    const offer = await s.offer();
    const r = new ReceiverLink();
    const got = new Promise((res) => (r.onChannel = (dc) => (dc.onmessage = (e) => res(e.data))));
    s.dc.onopen = () => s.dc.send("hello over wifi");
    const answer = await r.answer(s.offerId, offer);
    await s.accept(decodeAnswer(answer));
    const msg = await Promise.race([got, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout " + s.pc.iceConnectionState + "/" + r.pc.iceConnectionState)), 10000))]);
    out.textContent = `OK offer=${offer.length}B answer=${answer.length}B msg=${msg}`;
  } catch (e) {
    out.textContent = "FAIL " + e;
  }
</script>
